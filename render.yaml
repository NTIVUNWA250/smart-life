# Render blueprint for the SMART LIFE API.
#
# Render's free instances sleep after 15 minutes idle, so the first request
# after a quiet spell waits 30-60s while the container wakes. Warm it before a
# demo. The database is deliberately NOT defined here: Render's free Postgres
# expires after 30 days, so DATABASE_URL points at Neon instead (see
# docs/DEPLOYMENT.md).
services:
  - type: web
    name: smartlife-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    # --include=dev is required, not stylistic. NODE_ENV=production below applies
    # to the build as well as the runtime, and npm honours it by setting
    # omit=dev, which drops typescript and the prisma CLI. Without this the
    # build fails on "tsc: not found". start:prod needs the prisma CLI too.
    buildCommand: npm ci --include=dev && npm run build
    # migrate deploy runs on every boot. It is idempotent - already-applied
    # migrations are skipped - and free instances have no pre-deploy hook.
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PROVIDER_MODE
        value: sandbox
      # sync: false = set by hand in the Render dashboard, never in this file.
      # DATABASE_URL is Neon's pooled host (the one carrying "-pooler"), used by
      # the running server. DIRECT_DATABASE_URL is the unpooled host, used only
      # by prisma migrate deploy on boot: migrations take an advisory lock and
      # run DDL in one session, which PgBouncer transaction pooling breaks.
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # Not generateValue: the field encryption key must be exactly 64 hex
      # chars, and losing it makes every stored MoMo number unreadable. Generate
      # it once, paste it in, and keep a copy somewhere safe.
      - key: FIELD_ENCRYPTION_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false

  # The web app is a static export, so it needs no server and no cold start.
  # It lives here rather than on another host so the whole deployment is one
  # blueprint and one account.
  - type: web
    name: smartlife-web
    runtime: static
    # Built from the repo root, not from web/: the VUX design system lives at
    # design-system/ outside web/, and Next compiles it through externalDir.
    buildCommand: npm ci --prefix web && npm run build --prefix web
    staticPublishPath: ./web/out
    envVars:
      # Read at BUILD time and baked into the JavaScript. Changing it needs a
      # rebuild, not just a restart. Set to the API service's public URL.
      - key: NEXT_PUBLIC_API_URL
        sync: false
